[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API and static frontend server"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
